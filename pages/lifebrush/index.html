<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>lifebrush</title>
    <style>
      html, body {
        margin: 0; padding: 0;
        height: 100%; background: #000; color: #fff;
        font-family: monospace;
      }
      #lifebrush-container {
        position: absolute; inset: 0;
        overflow: hidden; /* same behavior as before */
      }
      #lifebrush-container, #lifebrush-container canvas {
        pointer-events: auto;
      }
      /* remove focus ring on the canvas */
      #lifebrush-container canvas { display: block; outline: none; }
      #lifebrush-container canvas:focus { outline: none; }
    </style>
    <!-- p5 (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
  </head>
  <body>
    <div id="lifebrush-container"></div>

    <!-- your existing sketch, placed next to this file -->
    <script src="./sketch.js"></script>

    <!-- tiny bridge to pause/resume when hidden -->
    <script src="./lifebrush-bridge.js"></script>
  </body>
</html>
