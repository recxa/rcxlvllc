<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>contact</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0a0a0c;
      color: #c8ccd4;
      font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .wrap {
      max-width: 480px;
      padding: 48px 24px;
    }

    h1 {
      font-size: 16px;
      font-weight: normal;
      color: #e8eaed;
      margin: 0 0 8px 0;
    }

    .subtitle {
      color: #667;
      font-size: 12px;
      margin-bottom: 32px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11px;
      color: #778;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea {
      background: #111114;
      border: 1px solid #2a2d33;
      color: #c8ccd4;
      font: inherit;
      padding: 12px 14px;
      transition: border-color 0.15s, background 0.15s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #3a4050;
      background: #141418;
    }

    input::placeholder, textarea::placeholder {
      color: #445;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      align-self: flex-start;
      padding: 10px 24px;
      background: #1a1c20;
      border: 1px solid #2a2d33;
      color: #b8bcc4;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    button:hover {
      background: #252830;
      border-color: #3a3d43;
      color: #e8eaed;
    }

    button:active {
      background: #1a1c20;
    }

    .note {
      font-size: 11px;
      color: #445;
      margin-top: 24px;
    }

    /* Success/error states */
    .message {
      padding: 12px 14px;
      font-size: 13px;
      display: none;
    }

    .message.success {
      background: #0d1a12;
      border: 1px solid #1a3a25;
      color: #6a9;
    }

    .message.error {
      background: #1a0d0d;
      border: 1px solid #3a1a1a;
      color: #a66;
    }

    .message.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>contact</h1>
    <div class="subtitle">get in touch</div>

    <div id="success-message" class="message success">
      Message sent. I'll get back to you soon.
    </div>

    <div id="error-message" class="message error">
      Something went wrong. Try emailing directly.
    </div>

    <form id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <div class="field">
        <label for="email">your email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="message">message</label>
        <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
      </div>

      <button type="submit">send</button>
    </form>

    <p class="note">
      Or reach out directly: replace this with your email
    </p>
  </div>

  <script>
    const form = document.getElementById('contact-form');
    const successMsg = document.getElementById('success-message');
    const errorMsg = document.getElementById('error-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          form.style.display = 'none';
          successMsg.classList.add('visible');
        } else {
          errorMsg.classList.add('visible');
        }
      } catch (err) {
        errorMsg.classList.add('visible');
      }
    });
  </script>
</body>
</html>
