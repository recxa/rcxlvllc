<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>rcx shell</title>
    <!-- IMPORTANT: Use absolute paths so this works from any URL depth (e.g., /rcx/01/readme) -->
    <link rel="stylesheet" href="/core/style.css" />
    <style>
      /* Welcome Overlay */
      .welcome-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(5, 5, 8, 0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.3s ease;
      }

      .welcome-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .welcome-modal {
        background: #0a0a0c;
        border: 1px solid #1a1c20;
        border-radius: 8px;
        padding: 48px;
        max-width: 480px;
        text-align: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .welcome-title {
        font-size: 24px;
        font-weight: normal;
        color: #e8eaed;
        margin: 0 0 8px 0;
      }

      .welcome-subtitle {
        font-size: 14px;
        color: #667;
        margin: 0 0 36px 0;
      }

      .welcome-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .welcome-btn {
        padding: 16px 24px;
        background: #1a1c20;
        border: 1px solid #2a2d33;
        border-radius: 6px;
        color: #b8bcc4;
        font: inherit;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
      }

      .welcome-btn:hover {
        background: #252830;
        border-color: #3a3d43;
        color: #e8eaed;
        transform: translateY(-1px);
      }

      .welcome-btn-primary {
        background: #1a2530;
        border-color: #2a4050;
        color: #8ab4d4;
      }

      .welcome-btn-primary:hover {
        background: #253545;
        border-color: #3a5565;
        color: #a8d0f0;
      }

      .welcome-btn-subtext {
        display: block;
        font-size: 11px;
        color: #556;
        margin-top: 6px;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <!-- Welcome Overlay -->
    <div id="welcome-overlay" class="welcome-overlay">
      <div class="welcome-modal">
        <h1 class="welcome-title">Welcome</h1>
        <p class="welcome-subtitle">How would you like to look around?</p>
        <div class="welcome-options">
          <button class="welcome-btn" onclick="dismissWelcome()">
            I want to wander and explore
          </button>
          <button class="welcome-btn" onclick="goToTour()">
            I'm an application reviewer
            <span class="welcome-btn-subtext">(I don't have all day)</span>
          </button>
        </div>
      </div>
    </div>

    <div class="container">
      <aside class="sidebar">
        <ul id="tree"><li>Loading…</li></ul>
        <div class="version-tag dev-overlay" style="display: none;">v0.1.2</div>
      </aside>

      <div class="content">
        <div id="viewer"></div>
      </div>
    </div>

    <!-- IMPORTANT: Use absolute paths so this works from any URL depth -->
    <script type="module" src="/core/externals.js"></script>
    <script src="/core/windows.js"></script>
    <script src="/core/sidebar-effects.js"></script>
    <script src="/core/manifest-bridge.js"></script>
    <script src="/core/sidebar.js"></script>
    <script src="/core/viewer.js"></script>
    <script src="/core/bus.js"></script>
    <script type="module" src="/core/router.js"></script>
    <script>
      // Welcome Overlay Logic
      function dismissWelcome() {
        const overlay = document.getElementById('welcome-overlay');
        if (overlay) {
          overlay.classList.add('hidden');
          sessionStorage.setItem('welcomeSeen', 'true');
        }
      }

      function goToTour() {
        dismissWelcome();
        // Navigate to tour page and update URL
        history.pushState({}, '', '/tour');
        if (window.viewer && window.viewer.show) {
          window.viewer.show('tour');
        } else {
          // Fallback: try after a short delay for viewer to initialize
          setTimeout(() => {
            if (window.viewer && window.viewer.show) {
              window.viewer.show('tour');
            }
          }, 500);
        }
      }

      // Initialize bridge after sidebar loads
      window.addEventListener('DOMContentLoaded', () => {
        ManifestBridge.init().then(() => {
          // Connect bridge to sidebar once both are ready
          if (window.sidebarAPI) {
            ManifestBridge.setSidebarAPI(window.sidebarAPI);
          }
        });

        // Hide welcome overlay if already seen this session
        if (sessionStorage.getItem('welcomeSeen')) {
          dismissWelcome();
        }

        // Click outside modal to dismiss
        const overlay = document.getElementById('welcome-overlay');
        if (overlay) {
          overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
              dismissWelcome();
            }
          });
        }
      });

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        // Don't trigger if typing in an input
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        if (e.key === 'e' || e.key === 'E') {
          if (window.SidebarEffects) {
            window.SidebarEffects.toggle();
          }
        } else if (e.key === 'Escape') {
          // Toggle dev overlays visibility (including in iframes)
          document.querySelectorAll('.dev-overlay').forEach(el => {
            el.style.display = el.style.display === 'none' ? '' : 'none';
          });
          // Also notify iframes
          document.querySelectorAll('iframe').forEach(iframe => {
            try {
              iframe.contentWindow.postMessage({ type: 'toggleDevOverlays' }, '*');
            } catch (e) {}
          });
        }
      });
    </script>
  </body>
</html>
